version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: vmailx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: vmailx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. Stalwart Mail Server
  stalwart:
    image: stalwartlabs/stalwart:latest
    container_name: vmailx-stalwart
    ports:
      - "25:25"     # SMTP
      - "587:587"   # SMTP Submission
      - "465:465"   # SMTP Implicit TLS
      - "143:143"   # IMAP
      - "993:993"   # IMAP Implicit TLS
      - "8080:8080" # JMAP & Admin API (Use reverse proxy for HTTPS in production)
    volumes:
      - stalwart_data:/opt/stalwart-mail/data
    restart: unless-stopped

  # 3. VMailx Next.js App
  vmailx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vmailx-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-password}@postgres:5432/vmailx
      - NEXT_PUBLIC_APP_URL=${APP_URL:-http://localhost:3000}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${APP_URL:-http://localhost:3000}
      - STALWART_ADMIN_URL=http://stalwart:8080
      - STALWART_ADMIN_TOKEN=${STALWART_ADMIN_TOKEN}
      - STALWART_JMAP_URL=${JMAP_URL:-http://localhost:8080/jmap}
      - SMTP_HOST=${SMTP_HOST:-stalwart}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      - postgres
      - stalwart
    restart: unless-stopped

  # 4. Caddy Reverse Proxy (Exposes App on Port 80)
  caddy:
    image: caddy:2-alpine
    container_name: vmailx-caddy
    ports:
      - "80:80"
    command: caddy reverse-proxy --from :80 --to vmailx:3000
    depends_on:
      - vmailx
    restart: unless-stopped

volumes:
  postgres_data:
  stalwart_data:
